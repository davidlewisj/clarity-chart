        const STORAGE_KEY = 'clarity-chart-org-data-v1';

            owner: 'davidlewisj',

            branch: 'main',

        };
        const HISTORY_LIMIT = 50;

        const sanitizeOrgData = (data) => {
            if (!data || typeof data !== 'object') return INITIAL_ORG_DATA;

            const removeIds = new Set(['6-4', '7-2-4']); // Julia Rivera and Ryann Uson

            const walk = (node) => {
                if (!node || typeof node !== 'object') return null;
                if (removeIds.has(node.id)) return null;

                const next = { ...node };
                if (node.id === '7') {
                    next.title = 'Dental Sleep Solutions';
                }
                if (Array.isArray(node.children)) {
                    const normalizedChildren = [];
                    for (const child of node.children) {
                        const mapped = walk(child);
                        if (!mapped) continue;
                        if (Array.isArray(mapped)) normalizedChildren.push(...mapped);
                        else normalizedChildren.push(mapped);
                    }
                    next.children = normalizedChildren;
                }

                // Remove Joanne and promote her direct reports under Kushner.
                if (node.id === '2') {
                    return Array.isArray(next.children) ? next.children : [];
                }

                return next;
            };

            const normalized = walk(data);
            if (!normalized) return INITIAL_ORG_DATA;
            if (Array.isArray(normalized)) {
                return { ...INITIAL_ORG_DATA, children: normalized };
            }
            return normalized;
        };

        const OrgNode = ({ node, expandedNodes, onToggle, searchTerm, editMode, selectedNodeId, onSelectNode }) => {
            const hasChildren = node.children && node.children.length > 0;
            const isExpanded = expandedNodes.has(node.id);
            const isMatch = searchTerm && (
                node.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                node.title.toLowerCase().includes(searchTerm.toLowerCase())
            );
            const isSelected = selectedNodeId === node.id;

            const HIDE_LOCATION_TYPES = ['visionary', 'integrator', 'manager'];
            const showLocation = !HIDE_LOCATION_TYPES.includes(node.type) && node.id !== "7-4";

            const getTheme = (type) => {
                switch (type) {
                    case 'visionary': return 'border-indigo-500 bg-indigo-50 text-indigo-900 shadow-indigo-100';
                    case 'integrator': return 'border-purple-500 bg-purple-50 text-purple-900 shadow-purple-100';
                    case 'manager': return 'border-blue-600 bg-blue-50 text-blue-900 shadow-blue-100';
                    case 'supervisor': return 'border-cyan-500 bg-cyan-50 text-cyan-900 shadow-cyan-100';
                    case 'director': return 'border-rose-500 bg-rose-50 text-rose-900 shadow-rose-100';
                    default: return 'border-slate-300 bg-white text-slate-800 shadow-slate-100';
                }
            };

            const getLocationColor = (location) => {
                switch (location) {
                    case 'Bellevue': return 'bg-amber-100 text-amber-800 border-amber-300';
                    case 'Federal Way': return 'bg-emerald-100 text-emerald-800 border-emerald-300';
                    case 'Silverdale': return 'bg-sky-100 text-sky-800 border-sky-300';
                    case 'Remote Support': return 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300';
                    default: return 'bg-slate-100 text-slate-600 border-slate-200';
                }
            };

            const locationsToRender = node.locations || (node.location ? [node.location] : []);

            return (
                <div className="flex flex-col items-center">
                    <div 
                        data-node-id={node.id}
                        onClick={() => {
                            if (editMode) {
                                onSelectNode(node.id);
                                return;
                            }
                            if (hasChildren) onToggle(node.id);
                        }}
                        className={`relative z-10 w-64 p-5 rounded-xl shadow-md border-2 transition-all duration-300 cursor-pointer
                            ${getTheme(node.type)}
                            ${isMatch ? 'ring-4 ring-yellow-400 scale-105 z-20 shadow-xl' : 'hover:shadow-lg hover:-translate-y-0.5'}
                            ${isSelected ? 'ring-4 ring-emerald-400 scale-[1.02] shadow-xl' : ''}
                        `}
                    >
                        {showLocation && locationsToRender.length > 0 && (
                            <div className="absolute top-2 right-2 flex flex-col gap-1 items-end z-20">
                                {locationsToRender.map((loc, i) => (
                                    <div key={i} className={`px-1.5 py-0.5 rounded-md border text-[9px] font-bold flex items-center gap-1 shadow-sm uppercase tracking-tighter ${getLocationColor(loc)}`}>
                                        <MapPinIcon />
                                        {loc}
                                    </div>
                                ))}
                            </div>
                        )}
                        <div className="flex flex-col items-center text-center gap-1 mt-1">
                            <h3 className={`font-bold text-sm leading-tight w-full text-left ${showLocation ? 'pr-12' : ''}`}>{node.name}</h3>
                            <p className="text-[11px] font-medium opacity-70 uppercase tracking-wide text-left w-full">{node.title}</p>
                        </div>
                        {hasChildren && (
                            <div className="absolute -bottom-3 left-1/2 -translate-x-1/2 bg-white rounded-full border border-slate-200 p-0.5 shadow-sm">
                                <ChevronDownIcon className={`w-3.5 h-3.5 text-slate-400 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} />
                            </div>
                        )}
                    </div>

                    {hasChildren && isExpanded && (
                        <div className="relative pt-10 flex">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[2px] h-10 bg-slate-300" />
                            <div className="flex gap-8">
                                {node.children.map((child, idx) => {
                                    const isFirst = idx === 0;
                                    const isLast = idx === node.children.length - 1;
                                    const isOnly = node.children.length === 1;
                                    return (
                                        <div key={child.id} className="relative">
                                            {!isOnly && (
                                                <div className={`absolute top-0 h-[2px] bg-slate-300 ${isFirst ? 'left-1/2 -right-4' : isLast ? '-left-4 right-1/2' : '-left-4 -right-4'}`} />
                                            )}
                                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[2px] h-10 bg-slate-300" />
                                            <div className="pt-10">
                                                <OrgNode
                                                    node={child}
                                                    expandedNodes={expandedNodes}
                                                    onToggle={onToggle}
                                                    searchTerm={searchTerm}
                                                    editMode={editMode}

                                                />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

        const App = () => {
            const getResponsiveDefaultZoom = () => {
                if (window.innerWidth < 640) return 0.45;
                if (window.innerWidth < 1024) return 0.62;
                return 0.8;

            const [orgData, setOrgData] = useState(() => {
                try {
                    const saved = window.localStorage.getItem(STORAGE_KEY);
                    if (!saved) return sanitizeOrgData(INITIAL_ORG_DATA);
                    const parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object' && parsed.id) return sanitizeOrgData(parsed);
                    return sanitizeOrgData(INITIAL_ORG_DATA);
                } catch {
                    return sanitizeOrgData(INITIAL_ORG_DATA);
                }
            });
            const [expandedNodes, setExpandedNodes] = useState(new Set(["1", "2", "3", "4", "5", "6", "7", "7-2", "7-4"]));
            const [searchTerm, setSearchTerm] = useState("");
            const [roleFilter, setRoleFilter] = useState('all');
            const [locationFilter, setLocationFilter] = useState('all');
            const [zoom, setZoom] = useState(getResponsiveDefaultZoom);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);

            const [isSmallScreen, setIsSmallScreen] = useState(window.innerWidth < 1024);

            const [newCard, setNewCard] = useState({
                name: '',
                title: '',
                type: 'staff',
                location: 'Silverdale',
                parentId: '1'
            });

            const cloneNode = useCallback((node) => ({
                ...node,
                children: node.children ? node.children.map(cloneNode) : undefined
            }), []);

            const findNodeById = useCallback((node, id, parent = null) => {
                if (!node) return null;
                if (node.id === id) return { node, parent };

                const res = await fetch(buildGitHubApiUrl(), { headers });
                if (res.status === 404) return { exists: false };
                if (!res.ok) {
                    const detail = await res.text();
                    throw new Error(`GitHub load failed (${res.status}): ${detail || res.statusText}`);
                }

                const payload = await res.json();
                if (!payload || !payload.content) {
                    throw new Error('GitHub response did not include file content.');
                }

                const decoded = decodeBase64Utf8(String(payload.content).replace(/\n/g, ''));

            const handleSaveSharedToGitHub = async () => {

                    if (!token) {

                            setEditorStatus('GitHub save cancelled (no token provided).');

                    }

                    let existing = null;
                    try {
                        existing = await fetchGitHubSharedFile(token);
                    } catch (readErr) {
                        const msg = String(readErr && readErr.message ? readErr.message : readErr);
                        if (msg.includes('(401)') || msg.includes('(403)')) {
                            clearGitHubToken();
                            const fresh = requestGitHubToken();
                            if (!fresh) {
                                setEditorStatus('GitHub save cancelled (token required).');
                                return;
                            }
                            token = fresh;
                            existing = await fetchGitHubSharedFile(token).catch((err) => {
                                const text = String(err && err.message ? err.message : err);

            const validateImportedTree = useCallback((root) => {
                const errors = [];
                const seenIds = new Set();
                const validTypes = new Set(TYPE_OPTIONS);

                const walk = (node, path) => {
                    if (!node || typeof node !== 'object' || Array.isArray(node)) {
                        errors.push(`${path} must be an object`);
                        return;
                    }

                    if (typeof node.id !== 'string' || !node.id.trim()) {
                        errors.push(`${path}.id is required and must be a non-empty string`);
                    } else if (seenIds.has(node.id)) {
                        errors.push(`Duplicate id found: ${node.id}`);
                    } else {

                    if (typeof node.name !== 'string' || !node.name.trim()) {
                        errors.push(`${path}.name is required and must be a non-empty string`);
                    }

                    if (typeof node.title !== 'string' || !node.title.trim()) {
                        errors.push(`${path}.title is required and must be a non-empty string`);
                    }

                    if (node.type && !validTypes.has(node.type)) {

                    if (node.children !== undefined) {

                    return;
                }

                const newId = `node-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
                const nodeToAdd = {
                    id: newId,
                    name: newCard.name.trim(),
                    title: newCard.title.trim(),
                    type: newCard.type,
                    location: newCard.location || ''
                };

                if (!parentHit.node.children) parentHit.node.children = [];
                parentHit.node.children.push(nodeToAdd);

                pushUndoSnapshot(orgData);
                setOrgData(draft);
                setExpandedNodes(prev => new Set(prev).add(newCard.parentId));
                setSelectedNodeId(newId);
                setEditorStatus('Card added.');
                setNewCard(prev => ({ ...prev, name: '', title: '' }));
            };

            const handleSaveCard = () => {
                if (!selectedNode) return;
                if (!editForm.name.trim() || !editForm.title.trim()) {
                    setEditorStatus('Name and title are required.');
                    return;
                }

                const draft = cloneNode(orgData);
                const currentHit = findNodeById(draft, selectedNode.id);
                if (!currentHit) return;

                currentHit.node.name = editForm.name.trim();
                currentHit.node.title = editForm.title.trim();
                currentHit.node.type = editForm.type;
                if (editForm.location) {
                    currentHit.node.location = editForm.location;
                    delete currentHit.node.locations;
                }

                const currentParentId = currentHit.parent ? currentHit.parent.id : currentHit.node.id;
                if (editForm.parentId && editForm.parentId !== currentParentId && selectedNode.id !== '1') {
                    if (selectedNode.id === editForm.parentId || isDescendant(currentHit.node, editForm.parentId)) {
                        setEditorStatus('Invalid move: cannot place a card under itself or its descendants.');
                        return;
                    }

                    if (currentHit.parent) {
                        currentHit.parent.children = (currentHit.parent.children || []).filter(child => child.id !== selectedNode.id);
                    }
                    const targetParentHit = findNodeById(draft, editForm.parentId);
                    if (!targetParentHit) {
                        setEditorStatus('Target parent not found.');
                        return;
                    }
                    if (!targetParentHit.node.children) targetParentHit.node.children = [];
                    targetParentHit.node.children.push(currentHit.node);
                    setExpandedNodes(prev => new Set(prev).add(editForm.parentId));
                }

                pushUndoSnapshot(orgData);
                setOrgData(draft);
                setEditorStatus('Card updated.');
            };

            const handleDeleteCard = () => {
                if (!selectedNode || selectedNode.id === '1') {
                    setEditorStatus('The top card cannot be deleted.');
                    return;
                }

                const shouldDelete = requireResetPhrase(`Delete "${selectedNode.name}" (ID: ${selectedNode.id}) and its sub-tree`);
                if (!shouldDelete) {
                    setEditorStatus('Delete cancelled.');
                    return;
                }

                const draft = cloneNode(orgData);
                const deleted = deleteNodeById(draft, selectedNode.id);
                if (!deleted) {
                    setEditorStatus('Card could not be deleted.');
                    return;
                }

                pushUndoSnapshot(orgData);
                setOrgData(draft);
                setSelectedNodeId('1');
                setEditorStatus('Card deleted.');
            };

            return (
                <div className="h-screen w-full bg-slate-50 flex flex-col overflow-hidden font-sans select-none">
                    <div className="bg-white border-b border-slate-200 px-3 md:px-8 py-3 md:py-4 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 z-50 shadow-sm">
                        <div className="flex items-center gap-4 md:gap-8 min-w-0">
                            <Logo />
                            <div className="h-10 w-px bg-slate-200 hidden md:block"></div>
                            <div className="min-w-0">
                                <h1 className="font-extrabold text-slate-900 text-lg md:text-xl leading-none uppercase truncate">Clarity Chart</h1>
                                <p className="text-[10px] uppercase tracking-widest text-slate-400 font-bold mt-1">Center for TMJ & Sleep Solutions NW</p>
                            </div>
                        </div>
                        <div className="w-full lg:w-auto overflow-x-auto overflow-y-visible">
                        <div className="flex items-center gap-2 md:gap-4 min-w-max pb-1 pr-2">
                            <div className="relative">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300"><SearchIcon /></div>
                                <input 
                                    type="text" 
                                    placeholder="Search team..."
                                    className="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm w-44 sm:w-56 md:w-64 focus:ring-2 focus:ring-black outline-none transition-all"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    onMouseDown={(e) => e.stopPropagation()}
                                />
                            </div>
                            <select
                                value={roleFilter}
                                onChange={(e) => setRoleFilter(e.target.value)}
                                className="px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold uppercase tracking-wide text-slate-600"
                            >
                                <option value="all">All Roles</option>
                                {TYPE_OPTIONS.map(type => <option key={type} value={type}>{type}</option>)}
                            </select>
                            <select
                                value={locationFilter}
                                onChange={(e) => setLocationFilter(e.target.value)}
                                className="px-3 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold uppercase tracking-wide text-slate-600"
                            >
                                <option value="all">All Locations</option>
                                {LOCATION_OPTIONS.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                            </select>
                            <div ref={toolsMenuRef} className="relative">
                                <button
                                    ref={toolsMenuButtonRef}
                                    type="button"
                                    title="Tools"
                                    aria-label="Tools"
                                    aria-haspopup="menu"
                                    aria-expanded={toolsMenuOpen}
                                    onClick={handleToolsMenuClick}
                                    onKeyDown={handleToolsMenuKeyDown}
                                    className="p-2.5 rounded-xl border bg-white text-slate-600 border-slate-200 cursor-pointer hover:bg-slate-50 touch-manipulation"
                                >
                                    <FolderIcon />
                                </button>
                                {toolsMenuOpen && (
                                    <div onPointerDown={(e) => e.stopPropagation()} className="fixed w-60 rounded-xl border border-slate-200 bg-white shadow-xl z-[120] p-2" style={{ top: `${toolsMenuPosition.top}px`, left: `${toolsMenuPosition.left}px` }} role="menu" aria-label="Toolbar tools">
                                        <button title="Clear filters" aria-label="Clear filters" onClick={() => { setRoleFilter('all'); setLocationFilter('all'); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100"><FilterXIcon /><span>Clear Filters</span></button>
                                        <button title="Reset view" aria-label="Reset view" onClick={() => { setPan({x:0, y:0}); setZoom(getResponsiveDefaultZoom()); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100"><RefreshIcon /><span>Reset View</span></button>
                                        <button title="Fit to screen" aria-label="Fit to screen" onClick={() => { handleFitToScreen(); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100"><FitIcon /><span>Fit to Screen</span></button>
                                        <button title="Focus selected card" aria-label="Focus selected card" onClick={() => { handleFocusSelectedCard(); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100"><TargetIcon /><span>Focus Selected</span></button>
                                        <button title="Load shared chart from GitHub" aria-label="Load shared chart from GitHub" onClick={() => { handleLoadSharedFromGitHub(true); setToolsMenuOpen(false); }} disabled={githubSyncBusy} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100 disabled:opacity-50"><ImportIcon /><span>Load Shared (GitHub)</span></button>
                                        <button title="Save shared chart to GitHub" aria-label="Save shared chart to GitHub" onClick={() => { handleSaveSharedToGitHub(); setToolsMenuOpen(false); }} disabled={githubSyncBusy} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100 disabled:opacity-50"><ExportIcon /><span>Save Shared (GitHub)</span></button>
                                        <button title="Export chart" aria-label="Export chart" onClick={() => { handleExportData(); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100"><ExportIcon /><span>Export</span></button>
                                        <button title="Import chart" aria-label="Import chart" onClick={() => { openImportPicker(); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-slate-700 hover:bg-slate-100"><ImportIcon /><span>Import</span></button>
                                        <button title="Reset chart" aria-label="Reset chart" onClick={() => { handleResetChart(); setToolsMenuOpen(false); }} className="w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm text-rose-700 hover:bg-rose-50"><EraserIcon /><span>Reset Chart</span></button>
                                        <button title={editMode ? 'Close editor' : 'Open editor'} aria-label={editMode ? 'Close editor' : 'Open editor'} onClick={() => { setEditMode(v => !v); setToolsMenuOpen(false); }} className={`w-full flex items-center gap-2 px-2 py-2 rounded-lg text-left text-sm hover:bg-slate-100 ${editMode ? 'text-emerald-700' : 'text-slate-700'}`}>
                                            {editMode ? <CloseIcon /> : <EditIcon />}
                                            <span>{editMode ? 'Close Editor' : 'Open Editor'}</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                            <div className="inline-flex items-center rounded-xl border border-slate-200 bg-white overflow-hidden">
                                <button title="Zoom out" aria-label="Zoom out" onClick={() => setZoom(z => Math.max(0.1, z - 0.1))} className="p-2.5 text-slate-600 hover:bg-slate-50"><ZoomOutIcon /></button>
                                <div className="text-[11px] font-bold text-slate-600 min-w-[56px] px-2 text-center border-x border-slate-200">{Math.round(zoom * 100)}%</div>
                                <button title="Zoom in" aria-label="Zoom in" onClick={() => setZoom(z => Math.min(2, z + 0.1))} className="p-2.5 text-slate-600 hover:bg-slate-50"><ZoomInIcon /></button>
                            </div>
                            <button title="Undo" aria-label="Undo" onClick={handleUndo} className="p-2.5 rounded-xl border bg-white text-slate-600 border-slate-200"><UndoIcon /></button>
                            <button title="Redo" aria-label="Redo" onClick={handleRedo} className="p-2.5 rounded-xl border bg-white text-slate-600 border-slate-200"><RedoIcon /></button>
                            <input ref={importInputRef} type="file" accept="application/json" className="hidden" onChange={handleImportData} />
                        </div>
                        </div>
                    </div>

                    <div className="flex-1 min-h-0 flex">
                        <div
                            ref={containerRef}
                            className="flex-1 relative overflow-hidden grab-cursor pan-surface"
                            onPointerDown={handlePointerDown}
                            onPointerMove={handlePointerMove}
                            onPointerUp={endDrag}
                            onPointerCancel={endDrag}
                        >
                            <div className="absolute inset-0 opacity-[0.3]" style={{ backgroundImage: `radial-gradient(circle, #cbd5e1 1px, transparent 1px)`, backgroundSize: `${30 * zoom}px ${30 * zoom}px`, transform: `translate(${pan.x}px, ${pan.y}px)` }} />
                            <div className="absolute w-full flex justify-center pt-20 pointer-events-none" style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`, transformOrigin: 'top center', transition: isDragging ? 'none' : 'transform 0.1s ease-out' }}>
                                <div ref={chartContentRef} className="pointer-events-auto">
                                    {filteredOrgData && ((filteredOrgData.children && filteredOrgData.children.length > 0) || roleFilter === 'all' && locationFilter === 'all') ? (
                                        <OrgNode
                                            node={filteredOrgData}
                                            expandedNodes={expandedNodes}
                                            onToggle={toggleNode}
                                            searchTerm={searchTerm}
                                            editMode={editMode}
                                            selectedNodeId={selectedNodeId}
                                            onSelectNode={setSelectedNodeId}
                                        />
                                    ) : (
                                        <div className="w-80 rounded-xl border border-slate-200 bg-white px-6 py-5 text-center shadow-sm">
                                            <p className="text-sm font-bold text-slate-800">No cards match the active filters.</p>
                                            <p className="mt-1 text-xs text-slate-500">Try clearing role/location filters.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {editMode && isSmallScreen && (
                            <div className="absolute inset-0 bg-black/35 z-[80]" onClick={() => setEditMode(false)} />
                        )}

                        {editMode && (
                            <aside className={`${isSmallScreen ? 'absolute right-0 top-0 bottom-0 z-[85] w-[min(92vw,360px)] shadow-2xl' : 'w-[340px]'} border-l border-slate-200 bg-white p-4 overflow-y-auto`}>
                                <button
                                    type="button"
                                    onClick={() => setEditMode(false)}
                                    className="ml-auto flex h-8 w-8 items-center justify-center rounded-full border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100"
                                    title="Close editor"
                                    aria-label="Close editor"
                                >
                                    <CloseIcon />
                                </button>
                                <h2 className="text-sm font-extrabold uppercase tracking-wide text-slate-900">Card Editor</h2>
                                <p className="text-xs text-slate-500 mt-1">Tap a card in the chart, then edit it or add a new card under it.</p>

                                {editorMessage && <div className="mt-3 text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2">{editorMessage}</div>}

                                <div className="mt-4 rounded-xl border border-slate-200 bg-slate-50 p-3">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-sm font-extrabold uppercase tracking-wide text-slate-900">Edit Card</h3>
                                        {isEditDirty && <span className="text-[10px] font-bold uppercase tracking-wide text-amber-700 bg-amber-100 border border-amber-200 rounded-md px-2 py-1">Unsaved</span>}
                                    </div>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Selected Card</label>
                                        <div className="text-xs font-semibold text-slate-800 bg-white border border-slate-200 rounded-lg px-3 py-2">{selectedNode ? `${selectedNode.name} (${selectedNode.id})` : 'None'}</div>
                                    </div>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Name</label>
                                        <input value={editForm.name} onChange={(e) => setEditForm(f => ({ ...f, name: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm" />
                                    </div>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Title</label>
                                        <input value={editForm.title} onChange={(e) => setEditForm(f => ({ ...f, title: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm" />
                                    </div>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Type</label>
                                        <select value={editForm.type} onChange={(e) => setEditForm(f => ({ ...f, type: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                                            {TYPE_OPTIONS.map(type => <option key={type} value={type}>{type}</option>)}
                                        </select>
                                    </div>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Location</label>
                                        <select value={editForm.location} onChange={(e) => setEditForm(f => ({ ...f, location: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                                            {LOCATION_OPTIONS.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                                        </select>
                                    </div>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Parent (Level Placement)</label>
                                        <select value={editForm.parentId} onChange={(e) => setEditForm(f => ({ ...f, parentId: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                                            {allNodes.filter(option => option.id !== selectedNodeId).map(option => (
                                                <option key={option.id} value={option.id}>{option.label}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="mt-4 flex gap-2">
                                        <button onClick={handleSaveCard} className="flex-1 px-3 py-2 bg-slate-900 text-white rounded-lg text-xs font-bold uppercase tracking-wide">Save Card</button>
                                        <button onClick={handleCancelEdit} className="px-3 py-2 bg-white text-slate-700 border border-slate-300 rounded-lg text-xs font-bold uppercase tracking-wide">Cancel</button>
                                        <button onClick={handleDeleteCard} className="px-3 py-2 bg-rose-50 text-rose-700 border border-rose-200 rounded-lg text-xs font-bold uppercase tracking-wide">Delete</button>
                                    </div>
                                </div>

                                <div className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 p-3">
                                    <h3 className="text-sm font-extrabold uppercase tracking-wide text-slate-900">Add Card</h3>
                                    <p className="mt-1 text-[11px] text-slate-600">Parent defaults to the currently selected card in edit mode.</p>

                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Name</label>
                                        <input value={newCard.name} onChange={(e) => setNewCard(f => ({ ...f, name: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm" />
                                    </div>
                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Title</label>
                                        <input value={newCard.title} onChange={(e) => setNewCard(f => ({ ...f, title: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm" />
                                    </div>
                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Type</label>
                                        <select value={newCard.type} onChange={(e) => setNewCard(f => ({ ...f, type: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                                            {TYPE_OPTIONS.map(type => <option key={type} value={type}>{type}</option>)}
                                        </select>
                                    </div>
                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Location</label>
                                        <select value={newCard.location} onChange={(e) => setNewCard(f => ({ ...f, location: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                                            {LOCATION_OPTIONS.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                                        </select>
                                    </div>
                                    <div className="mt-3 space-y-2">
                                        <label className="text-[11px] font-bold uppercase tracking-wide text-slate-500">Parent (Level Placement)</label>
                                        <select value={newCard.parentId} onChange={(e) => setNewCard(f => ({ ...f, parentId: e.target.value }))} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm">
                                            {allNodes.map(option => (
                                                <option key={option.id} value={option.id}>{option.label}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <button onClick={handleAddCard} className="mt-4 w-full px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold uppercase tracking-wide">Add Card</button>
                                </div>
                            </aside>
                        )}
                    </div>

                    {importValidationErrors.length > 0 && (
                        <div className="absolute inset-0 bg-black/40 z-[90] flex items-center justify-center p-4">
                            <div className="w-full max-w-2xl bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
                                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                                    <div>
                                        <h3 className="text-sm font-extrabold uppercase tracking-wide text-slate-900">Import Validation Details</h3>
                                        <p className="text-xs text-slate-500 mt-1">Found {importValidationErrors.length} issue{importValidationErrors.length > 1 ? 's' : ''} in the selected file.</p>
                                    </div>
                                    <button
                                        onClick={() => setImportValidationErrors([])}
                                        className="px-3 py-1.5 text-xs font-bold uppercase tracking-wide rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50"
                                    >
                                        Close
                                    </button>
                                </div>
                                <div className="max-h-[55vh] overflow-y-auto p-4 bg-slate-50">
                                    <ol className="space-y-2 list-decimal list-inside text-sm text-slate-700">
                                        {importValidationErrors.map((error, idx) => (
                                            <li key={`${error}-${idx}`} className="bg-white border border-slate-200 rounded-lg px-3 py-2">{error}</li>
                                        ))}
                                    </ol>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
